<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Benue Life</title>
  <meta name="description" content="Walk through Makurdi in 3D. Wurukum Market, the Old Bridge over the River Benue, and more." />
  <style>
    html,body{margin:0;height:100%;background:#0b0b0c;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
    canvas{display:block}
    #hud{position:fixed;inset:0;pointer-events:none}
    #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(20,10,0,.34) 100%)}
    #top{position:absolute;left:16px;top:14px;display:flex;gap:10px;align-items:center;pointer-events:auto}
    .brand{font-weight:700;letter-spacing:-.02em;font-size:18px;background:rgba(15,15,15,.55);backdrop-filter:blur(10px);padding:9px 14px;border-radius:14px}
    .brand b{color:#3fbf7f}
    .tabs{display:flex;gap:6px;background:rgba(15,15,15,.55);backdrop-filter:blur(10px);padding:5px;border-radius:14px}
    .tabs button{all:unset;cursor:pointer;padding:7px 13px;border-radius:10px;font-size:13px;font-weight:600;color:#d8d8d2}
    .tabs button.on{background:#fff;color:#111}
    #place{position:absolute;left:16px;bottom:16px;max-width:360px;background:rgba(15,15,15,.55);backdrop-filter:blur(10px);padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45;color:#e6e6e0}
    #place h2{margin:0 0 4px;font-size:15px;color:#fff}
    #help{position:absolute;right:16px;bottom:16px;background:rgba(15,15,15,.55);backdrop-filter:blur(10px);padding:10px 14px;border-radius:14px;font-size:12px;color:#cfcfc8}
    #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(circle at 50% 40%,#1c2a22,#0b0b0c 70%);z-index:5;text-align:center;padding:24px}
    #start h1{margin:0;font-size:clamp(34px,7vw,64px);letter-spacing:-.04em}
    #start h1 b{color:#3fbf7f}
    #start p{margin:0;color:#b8b8b0;max-width:440px}
    #go{all:unset;cursor:pointer;background:#3fbf7f;color:#06130c;font-weight:700;padding:14px 26px;border-radius:14px;font-size:16px}
    #bar{width:220px;height:4px;background:#222;border-radius:4px;overflow:hidden}
    #bar i{display:block;height:100%;width:0;background:#3fbf7f;transition:width .2s}
    #joy{position:fixed;left:22px;bottom:90px;width:120px;height:120px;border-radius:60px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);touch-action:none;display:none;pointer-events:auto}
    #joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.4)}

    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 40%,#1c2a22,#0b0b0c 70%);z-index:9}
    #loading h1{margin:0;font-size:clamp(34px,7vw,60px);letter-spacing:-.04em}#loading h1 b{color:#3fbf7f}
    .pill{all:unset;background:rgba(15,15,15,.55);backdrop-filter:blur(10px);padding:9px 14px;border-radius:14px;font-size:13px;font-weight:600;color:#e6e6e0;cursor:pointer}
    #online{cursor:default;display:flex;align-items:center;gap:7px}#online i{width:8px;height:8px;border-radius:4px;background:#888;display:block}#online.on i{background:#3fbf7f}
    #creator{position:fixed;left:0;top:0;bottom:0;width:min(400px,100vw);z-index:6;display:flex;flex-direction:column;background:linear-gradient(90deg,rgba(11,14,12,.94),rgba(11,14,12,.86));backdrop-filter:blur(14px);border-right:1px solid rgba(255,255,255,.08)}
    #creator[hidden]{display:none}
    body.creating #top{left:416px}@media (max-width:760px){body.creating #top{left:16px}}
    .cr-head{padding:22px 22px 8px}.cr-head h2{margin:0;font-size:24px;letter-spacing:-.03em}.cr-head p{margin:4px 0 0;color:#a9aaa2;font-size:13px}
    .cr-body{flex:1;overflow:auto;padding:8px 22px 14px}
    .cr-sec{margin:14px 0}.cr-sec>label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8e9088;margin-bottom:7px;font-weight:700}
    .cr-row{display:flex;flex-wrap:wrap;gap:7px}
    .sw{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.18);box-sizing:border-box}.sw.on{border-color:#fff;box-shadow:0 0 0 2px #3fbf7f}
    .ch{all:unset;cursor:pointer;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.07);font-size:13px;font-weight:600;color:#d6d6cf}.ch.on{background:#fff;color:#0d0d0d}
    .cr-in{width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:11px 13px;color:#fff;font-size:15px;outline:none}.cr-in:focus{border-color:#3fbf7f}.cr-in.bad{border-color:#e55}
    .cr-body.model-on .cr-proc{display:none}
    .cr-range{width:100%;accent-color:#3fbf7f}
    .cr-foot{display:flex;gap:10px;padding:14px 22px 20px;border-top:1px solid rgba(255,255,255,.08)}
    .cr-btn{all:unset;cursor:pointer;flex:1;text-align:center;background:#3fbf7f;color:#06130c;font-weight:800;padding:13px;border-radius:13px;font-size:15px}.cr-btn.ghost{flex:0 0 auto;background:rgba(255,255,255,.1);color:#e6e6e0;font-weight:700;padding:13px 16px}
    @media (max-width:760px){#creator{top:auto;width:100vw;height:52vh;border-right:0;border-top:1px solid rgba(255,255,255,.1);background:rgba(11,14,12,.93)}.cr-head{padding:14px 18px 2px}.cr-head h2{font-size:19px}}
    @media (pointer:coarse){#joy{display:block}#help{display:none}}
  </style>
</head>
<body>
  <div id="loading"><h1>Benue <b>Life</b></h1><div id="bar"><i></i></div></div>
  <div id="creator" hidden></div>
  <div id="vig"></div>
  <div id="hud">
    <div id="top">
      <div class="brand">Benue <b>Life</b></div>
      <div class="tabs"><button data-z="market" class="on">Wurukum Market</button><button data-z="bridge">Old Bridge</button></div>
      <button id="chbtn" class="pill">Character</button>
      <div id="online" class="pill"></div>
    </div>
    <div id="place"></div>
    <div id="help">WASD move · Shift run · drag to look · scroll to zoom</div>
    <div id="joy"><i></i></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
